<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visit counting | Janine Isaacs</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f7f4ef; color: #2b2622; font-family: Inter, system-ui, sans-serif; font-weight: 300; padding: 24px; box-sizing: border-box; }
  main { max-width: 440px; text-align: center; }
  h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 2rem; margin: 0 0 16px; }
  p { line-height: 1.6; margin: 0 0 20px; }
  button { font: inherit; background: none; border: 1px solid #2b2622; color: #2b2622; padding: 10px 18px; cursor: pointer; }
  a { color: inherit; }
</style>
<!-- Deliberately no Umami script on this page. -->
</head>
<body>
<main>
  <h1 id="h">Done</h1>
  <p id="msg">Visits from this browser to janineisaacs.com will no longer be counted.</p>
  <p class="small">Open this page once on each phone, tablet and computer, and in each browser you use.</p>
  <p><button id="toggle" type="button">Count my visits again</button></p>
  <p><a href="/">Back to the site</a></p>
</main>
<script>
  var KEY = 'umami.disabled';
  var h = document.getElementById('h'), msg = document.getElementById('msg'), btn = document.getElementById('toggle');
  function show(off) {
    h.textContent = off ? 'Done' : 'Counting is on';
    msg.textContent = off
      ? 'Visits from this browser to janineisaacs.com will no longer be counted.'
      : 'Visits from this browser are being counted again.';
    btn.textContent = off ? 'Count my visits again' : 'Stop counting my visits';
  }
  try {
    localStorage.setItem(KEY, '1');
    show(true);
    btn.addEventListener('click', function () {
      var off = localStorage.getItem(KEY) === '1';
      if (off) { localStorage.removeItem(KEY); } else { localStorage.setItem(KEY, '1'); }
      show(!off);
    });
  } catch (e) {
    h.textContent = 'Not possible here';
    msg.textContent = 'This browser is blocking the setting (often private browsing). Try a normal window.';
    btn.hidden = true;
  }
</script>
</body>
</html>
